name: CI

on:
  push:
    branches: ['**']
  pull_request:
  repository_dispatch:
    types: [run_build]
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
        default: ''
    outputs:
      artifact:
        description: Verified release bundle artifact name
        value: ${{ jobs.vpk.outputs.artifact }}

permissions:
  contents: read

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    outputs:
      artifact: ${{ steps.core.outputs.artifact }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
        submodules: recursive
        persist-credentials: false

    - name: Trust only this mounted checkout inside the SDK container
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Install dependencies
      run: |
        yes | vdpm opensles libsndfile lame mpg123 opus libvorbis libogg flac libmathneon vitaShaRK kubridge taihen SceShaccCgExt zlib

    - name: Get information variables
      id: core
      run: |
        echo "artifact=dqivn-$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

    - name: Compile project (Release, no developer tools)
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --target dqivn.vpk-vpk -j$(nproc)

    - name: Verify package and provenance
      run: |
        python3 tools/check_release.py build --require-clean-source --output release/ci
        cd release/ci
        sha256sum -c SHA256SUMS

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.core.outputs.artifact }}
        path: release/ci/*
        if-no-files-found: error

  tools:
    # the data-preparation script must at least start everywhere (the real conversion needs the game files, which CI does not have)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: make_data.py --help
      run: python tools/make_data.py --help
    - name: install converter requirements
      run: python -m pip install -r tools/requirements.txt
    - name: converter imports
      run: python -c "import sys; sys.path.insert(0, 'tools/convert'); import UnityPy, texture2ddecoder, numpy; from dqivconv import blob, tex, mesh, material, misc, prefab; print('ok')"
