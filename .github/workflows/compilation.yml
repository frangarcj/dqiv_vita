name: CI

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        yes | vdpm opensles libsndfile lame mpg123 opus libvorbis libogg flac libmathneon vitaShaRK kubridge taihen SceShaccCgExt zlib

    - name: Get information variables
      id: core
      run: |
        echo "sha8=$(echo ${GITHUB_SHA} | cut -c1-8)" >> "$GITHUB_OUTPUT"

    - name: Compile project (Release, no developer tools)
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
        cmake --build build --target dqivn.vpk-vpk -j$(nproc)

    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: dqivn-${{ steps.core.outputs.sha8 }}.vpk
        path: build/dqivn.vpk

    - uses: svenstaro/upload-release-action@v2
      if: contains(github.ref,'refs/tags')
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: build/dqivn.vpk
        overwrite: true
        tag: ${{ github.ref }}

  tools:
    # the data-preparation script must at least start everywhere (the real conversion needs the game files, which CI does not have)
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: make_data.py --help
      run: python tools/make_data.py --help
    - name: install converter requirements
      run: python -m pip install -r tools/requirements.txt
    - name: converter imports
      run: python -c "import sys; sys.path.insert(0, 'tools/convert'); import UnityPy, texture2ddecoder, numpy; from dqivconv import blob, tex, mesh, material, misc, prefab; print('ok')"
