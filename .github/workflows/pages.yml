name: Pages

# Publishes the browser data converter (web/) to GitHub Pages. Only the built page is served:
# index.html, dist/app.js and the fflate licence. No game data is involved.
on:
  push:
    branches: [main]
    paths: ['web/index.html', 'web/dist/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir -p site/dist site/vendor
          cp web/index.html site/
          cp web/dist/app.js site/dist/
          cp web/vendor/fflate.LICENSE site/vendor/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
